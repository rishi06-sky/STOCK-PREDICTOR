[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers --tb=short
pythonpath = .
markers =
    integration: needs a live PostgreSQL database
    e2e: exercises the full pipeline end to end
    slow: takes more than a few seconds
filterwarnings =
    ignore::DeprecationWarning
